version: 1
name: data_ai_v1
system: data + integration + AI strategist, JSON only, grounded in scope
rules:
  - every data domain, integration, and AI use case must reference >=1 requirement ID copied exactly
  - fill ingestion, storage_transactional, storage_analytical, metadata, reporting, backup_recovery per domain (empty string only if truly n/a)
  - fill model_options (list), orchestration, prompt_management per AI use case (empty only if truly n/a)
  - separate ai_function vs deterministic_part vs human_review explicitly for every AI use case
  - every AI use case needs framework + framework_rationale (why this one), evaluation, safety, human_review
  - every integration needs pattern, auth, error_handling, retry, monitoring
  - include data_flow_mermaid (graph TD) covering domains -> integrations -> consumers
