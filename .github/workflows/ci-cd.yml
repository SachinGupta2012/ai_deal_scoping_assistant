name: CI/CD

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

# Cancel superseded runs on the same ref/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-check:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scoping
          POSTGRES_PASSWORD: scoping
          POSTGRES_DB: scoping_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scoping:scoping@localhost:5432/scoping_test
      JWT_SECRET_KEY: ci-test-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps + ruff
        run: pip install -r backend/requirements.txt ruff
      - name: Lint (fatal-error rules)
        run: ruff check --select E9,F63,F7,F82 backend
      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-check:
    name: Frontend (tsc + next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    # Only images the reviewed-and-merged state of main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image base
        id: base
        run: |
          echo "base=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.base.outputs.base }}-backend:main
            ghcr.io/${{ steps.base.outputs.base }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.base.outputs.base }}-frontend:main
            ghcr.io/${{ steps.base.outputs.base }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (gated stub — no target yet)
    runs-on: ubuntu-latest
    needs: [publish-images]
    # Intentionally disabled until a real deployment target exists (VPS / PaaS).
    # To enable later: replace `if: false` with an environment-gated condition, e.g.
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # and add `environment: production` with required reviewer approval.
    if: false
    steps:
      - name: Explain
        run: |
          echo "Deploy target not configured yet. Images are published to GHCR by publish-images."
